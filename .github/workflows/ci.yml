name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action revision
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo build --workspace --locked --offline
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: python3 scripts/dependency_inventory.py --check
