[workspace]
members = ["crates/josh-core", "crates/josh-jev", "crates/josh-ingest", "crates/josh-app"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
publish = false
rust-version = "1.98.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
schemars = "=1.2.2"
csv = "=1.4.0"
tempfile = "3"
